<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Battle City</title>
<style>
  :root {
    --bg: #0d0d14;
    --panel: #1a1a28;
    --border: #2e2e44;
    --accent: #f0c040;
    --text: #e8e8f0;
    --muted: #8a8aa0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #15151f, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #app { text-align: center; padding: 12px; }
  h1 {
    font-size: 24px;
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 14px rgba(240,192,64,.45);
    margin-bottom: 10px;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 16px;
    margin: 0 auto 10px;
    max-width: 700px;
    font-size: 14px;
  }
  #hud .stat { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  #hud .stat b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
  #diff { font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  #stage {
    position: relative;
    display: inline-block;
    line-height: 0;
    border: 3px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: min(92vw, 660px);
    height: auto;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(8,8,14,.85);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay .title { font-size: 30px; letter-spacing: 4px; color: var(--accent); text-shadow: 0 0 16px rgba(240,192,64,.5); }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 1.7; }
  #overlay .big { font-size: 22px; letter-spacing: 3px; }
  #diffmenu { display: flex; gap: 12px; }
  .diff-opt {
    cursor: pointer;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    min-width: 104px;
    transition: all .15s;
  }
  .diff-opt .dn { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .diff-opt .dd { font-size: 12px; color: var(--muted); }
  .diff-opt.sel { border-color: var(--accent); background: rgba(240,192,64,.12); box-shadow: 0 0 16px rgba(240,192,64,.35); }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  #help { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  #help kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 7px;
    font-family: inherit;
    color: var(--text);
  }
</style>
</head>
<body>
<div id="app">
  <h1>坦克大战</h1>
  <div id="hud">
    <div class="stat">关卡 <b id="level">1</b> <span id="diff">普通</span></div>
    <div class="stat"><span class="dot" style="background:#f0c040"></span> 生命 <b id="lives">3</b></div>
    <div class="stat"><span class="dot" style="background:#c05050"></span> 敌人 <b id="enemies">0</b></div>
    <div class="stat">得分 <b id="score">0</b></div>
  </div>
  <div id="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="help">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动 &nbsp; <kbd>空格</kbd> 射击 &nbsp; <kbd>P</kbd> 暂停 &nbsp; <kbd>M</kbd> 静音
  </div>
</div>

<script>
"use strict";

/* ================= 常量 ================= */
const TILE = 32;
const COLS = 15, ROWS = 15;
const W = COLS * TILE, H = ROWS * TILE;       // 480 x 480
const TANK = 28;                               // 坦克边长
const BULLET = 6;                              // 子弹边长
const BOSS_SIZE = 64;                          // Boss 边长(2×2 格)
const MAX_LIVES = 5;

// 速度单位：像素/秒（乘 dt 保证帧率无关）
const PLAYER_SPEED = 120;
const BULLET_SPEED = [360, 480, 540];          // 火力1/2/3 的子弹速度
const ENEMY_BULLET_SPEED = 240;

const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

/* ================= 难度选项 ================= */
const DIFF_OPTIONS = [
  { id: "easy",   name: "简单", desc: "敌人少·慢·弱", offset: -2, color: "#7ecb7e" },
  { id: "normal", name: "普通", desc: "标准挑战",     offset: 0,  color: "#e8c040" },
  { id: "hard",   name: "困难", desc: "敌人多·快·强", offset: 2,  color: "#e05050" },
];
let diffId = "normal", menuSel = 1;
function curDiff() { return DIFF_OPTIONS.find(o => o.id === diffId); }
function effLv(lv) { return Math.max(1, lv + curDiff().offset); }

function levelTotal(lv) { return Math.min(16 + effLv(lv) * 3, 60); }               // 本关敌人总数
function maxOnField(lv) { return Math.min(4 + Math.floor((effLv(lv) - 1) / 2), 8); } // 同时在场数
function enemySpeedMult(lv) { return Math.min(1 + (effLv(lv) - 1) * 0.12, 2.0); }    // 敌人速度倍率
function spawnDelay(lv) { return Math.max(320, 800 - (effLv(lv) - 1) * 70); }       // 生成间隔(ms)

/* 地图字符：. 空地 B 砖墙 S 钢板 W 水 T 树 E 基地 */
const MAPS = [
  [
    "...............",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    ".......B.B.....",
    "..BB.......BB..",
    "..BB..B.B..BB..",
    ".......S.......",
    "..BB..B.B..BB..",
    "..BB.......BB..",
    ".......B.B.....",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    "...............",
    "...............",
    "......BEB......",
  ],
  [
    "...............",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    ".......B.B.....",
    "..BB.......BB..",
    "..BB..B.B..BB..",
    "..S...B.B...S..",
    "..BB..B.B..BB..",
    "..BB.......BB..",
    ".......B.B.....",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    "...............",
    "...............",
    "......BEB......",
  ],
  [
    "...............",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    ".......B.B.....",
    "..BB.......BB..",
    "..BB..B.B..BB..",
    ".......S.......",
    "..BB..B.B..BB..",
    "..BB.......BB..",
    ".......B.B.....",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    "......BBB......",
    "......B.B......",
    "......BEB......",
  ],
  [
    "...............",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    ".......B.B.....",
    "..BB..WWW..BB..",
    "..BB..W.W..BB..",
    ".......S.......",
    "..BB..W.W..BB..",
    "..BB..WWW..BB..",
    ".......B.B.....",
    ".B.B.B...B.B.B.",
    ".B.B.B...B.B.B.",
    "...............",
    "...............",
    "......BEB......",
  ],
];

/* ================= 音效 ================= */
const Audio = (() => {
  let ctx = null, muted = false;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return;
    const ac = ensure(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function noise(dur, vol) {
    if (muted) return;
    const ac = ensure(); if (!ac) return;
    const len = ac.sampleRate * dur;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf; g.gain.value = vol || 0.15;
    s.connect(g).connect(ac.destination); s.start();
  }
  return {
    shoot()    { tone(880, 0.08, "square", 0.05, 220); },
    boom()     { noise(0.25, 0.18); tone(160, 0.2, "sawtooth", 0.06, 60); },
    hit()      { tone(300, 0.06, "square", 0.05, 120); },
    pickup()   { tone(660, 0.09, "square", 0.08); setTimeout(() => tone(990, 0.12, "square", 0.08), 80); },
    powerdown(){ tone(440, 0.25, "sawtooth", 0.09, 80); },
    start()    { tone(440, 0.1, "square", 0.08); setTimeout(() => tone(660, 0.14, "square", 0.08), 110); },
    toggleMute(){ muted = !muted; return muted; },
  };
})();

/* ================= 游戏状态 ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const elLevel = document.getElementById("level");
const elDiff = document.getElementById("diff");
const elScore = document.getElementById("score");
const elLives = document.getElementById("lives");
const elEnemies = document.getElementById("enemies");

let map, level, score, lives, state, enemiesRemaining, spawnQueue;
let player, enemies, bullets, powerups, particles;
let baseArmoredUntil, lastTime, banner, boss;

const keys = {};
const P_UP = ["ArrowUp", "KeyW"], P_DOWN = ["ArrowDown", "KeyS"],
      P_LEFT = ["ArrowLeft", "KeyA"], P_RIGHT = ["ArrowRight", "KeyD"],
      P_FIRE = ["Space", "Enter", "KeyJ"];

function resetGame() { level = 1; score = 0; lives = 3; loadLevel(); }

function loadLevel() {
  map = MAPS[(level - 1) % MAPS.length].map(r => r.split(""));
  map[13][6] = "B"; map[13][7] = "B"; map[13][8] = "B";   // 基地上方加固一层砖
  player = makePlayer();
  enemies = []; bullets = []; powerups = []; particles = [];
  baseArmoredUntil = 0;
  const isBoss = level % 5 === 0;
  boss = isBoss ? makeBoss(level) : null;
  enemiesRemaining = isBoss ? Math.min(4, 2 + Math.floor(level / 5)) : levelTotal(level);
  spawnQueue = [{ t: 250 }, { t: 500 }, { t: 750 }, { t: 1000 }];
  const d = curDiff();
  banner = {
    title: isBoss ? "⚠ BOSS 战 ⚠" : "第 " + level + " 关",
    sub: isBoss ? d.name + " · BOSS HP " + boss.maxHp : d.name + " · 敌人 ×" + enemiesRemaining,
    until: performance.now() + 2200,
    color: isBoss ? "#e05050" : d.color,
  };
  state = "playing";
  hideOverlay();
  updateHud();
}

/* ================= 玩家 ================= */
function makePlayer() {
  return {
    x: 3 * TILE + (TILE - TANK) / 2, y: 14 * TILE + (TILE - TANK) / 2,
    dir: DIR.UP, fire: 1, alive: true, respawn: 0,
    shieldUntil: 0, cooldown: 0,
  };
}

/* ================= 敌人 ================= */
const ETYPE = [
  { color: "#9aa0b0", speed: 46,  hp: 1, score: 100, drop: false },   // 普通
  { color: "#e06060", speed: 76,  hp: 1, score: 200, drop: false },   // 快速
  { color: "#6f8f6f", speed: 36,  hp: 2, score: 300, drop: false },   // 重甲
  { color: "#e8c040", speed: 46,  hp: 1, score: 400, drop: true  },   // 补给(掉落道具)
];
function pickEnemyType(lv) {
  const el = effLv(lv);
  const r = Math.random();
  if (el >= 3 && r < 0.14) return 3;
  if (el >= 2 && r < 0.34) return 2;
  if (el >= 1 && r < 0.62) return 1;
  return 0;
}
const SPAWN_COLS = [0, 7, 14];
function makeEnemy(type, lv) {
  const occupied = new Set(enemies.filter(e => e.alive).map(e => Math.round(e.x / TILE) + ":" + Math.round(e.y / TILE)));
  if (boss && boss.alive) {
    occupied.add(Math.floor(boss.x / TILE) + ":0");
    occupied.add(Math.floor((boss.x + boss.w - 1) / TILE) + ":0");
  }
  let col = SPAWN_COLS[Math.floor(Math.random() * SPAWN_COLS.length)];
  for (let i = 0; i < SPAWN_COLS.length; i++) {
    if (!occupied.has(SPAWN_COLS[i] + ":0")) { col = SPAWN_COLS[i]; break; }
  }
  return {
    x: col * TILE + (TILE - TANK) / 2, y: (TILE - TANK) / 2,
    dir: DIR.DOWN, type, hp: ETYPE[type].hp, alive: true,
    speed: ETYPE[type].speed * enemySpeedMult(lv),
    cooldown: 1500 + Math.random() * 1000,
    turn: 500 + Math.random() * 800,
    flash: 1200,   // 出生无敌帧
  };
}

/* ================= Boss ================= */
function makeBoss(lv) {
  const hp = 15 + effLv(lv) * 2;
  return {
    x: 6 * TILE, y: 0, w: BOSS_SIZE, h: BOSS_SIZE,
    hp, maxHp: hp, dir: DIR.DOWN,
    vx: 16, vy: 11, cooldown: 1100, alive: true,
  };
}
function updateBoss(dt) {
  const b = boss, s = dt / 1000;
  if (!b || !b.alive) return;
  b.cooldown -= dt;
  b.x += b.vx * s;
  if (b.x < 0 || b.x + b.w > W || hitsSolid(b.x, b.y, b.w, b.h, true)) { b.x -= b.vx * s; b.vx = -b.vx; }
  b.y += b.vy * s;
  if (b.y + b.h > H || hitsSolid(b.x, b.y, b.w, b.h, true)) { b.y -= b.vy * s; }
  if (b.cooldown <= 0) { fireBossSpread(b); b.cooldown = 1800; }
}
function fireBossSpread(b) {
  const cx = b.x + b.w / 2;
  for (const off of [-20, 0, 20]) {
    bullets.push({ x: cx + off - BULLET / 2, y: b.y + b.h, dir: DIR.DOWN, side: "enemy", dead: false, power: 1, speed: ENEMY_BULLET_SPEED });
  }
  if (Math.random() < 0.4) {
    bullets.push({ x: b.x - BULLET, y: b.y + b.h / 2 - BULLET / 2, dir: DIR.LEFT, side: "enemy", dead: false, power: 1, speed: ENEMY_BULLET_SPEED });
    bullets.push({ x: b.x + b.w, y: b.y + b.h / 2 - BULLET / 2, dir: DIR.RIGHT, side: "enemy", dead: false, power: 1, speed: ENEMY_BULLET_SPEED });
  }
}
function killBoss() {
  boss.alive = false;
  score += 1000;
  boom(boss.x / TILE, boss.y / TILE);
  boom(boss.x / TILE + 1, boss.y / TILE + 1);
  Audio.boom();
}

/* ================= 道具 ================= */
const PTYPE = ["star", "shield", "grenade", "helmet", "life"];
function makePowerup(x, y) {
  return { x, y, type: PTYPE[Math.floor(Math.random() * PTYPE.length)], t: 0 };
}

/* ================= 输入 ================= */
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    keys[e.code] = true;
    if (state === "menu") handleMenuKey(e.code);
    else if (state === "gameover") { state = "menu"; renderMenu(); }
    else if (e.code === "KeyP") togglePause();
    else if (e.code === "KeyM") { Audio.toggleMute(); }
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function handleMenuKey(code) {
  if (code === "ArrowLeft" || code === "ArrowUp") { menuSel = (menuSel + 2) % 3; renderMenu(); }
  else if (code === "ArrowRight" || code === "ArrowDown") { menuSel = (menuSel + 1) % 3; renderMenu(); }
  else if (code === "Space" || code === "Enter") { diffId = DIFF_OPTIONS[menuSel].id; startPressed(); }
}

function isDown(codes) { return codes.some(c => keys[c]); }

function startPressed() { Audio.start(); resetGame(); }

function togglePause() {
  if (state === "playing") { state = "paused"; showOverlay("已暂停", "按 P 继续", true); }
  else if (state === "paused") { state = "playing"; hideOverlay(); }
}

/* ================= 覆盖层 ================= */
function renderMenu() {
  overlay.classList.remove("hidden");
  overlay.innerHTML =
    `<div class="title">坦克大战</div>
     <div class="sub">选择难度</div>
     <div id="diffmenu">` +
    DIFF_OPTIONS.map((o, i) =>
      `<div class="diff-opt${i === menuSel ? " sel" : ""}" data-idx="${i}">
         <div class="dn" style="color:${o.color}">${o.name}</div>
         <div class="dd">${o.desc}</div>
       </div>`).join("") +
    `</div>
     <div class="sub">← → 选择 &nbsp;·&nbsp; 空格 / 回车 开始（或点击难度）</div>`;
  document.querySelectorAll("#diffmenu .diff-opt").forEach(el => {
    el.onclick = () => { menuSel = +el.dataset.idx; diffId = DIFF_OPTIONS[menuSel].id; startPressed(); };
  });
}
function showOverlay(title, sub, blink) {
  overlay.classList.remove("hidden");
  overlay.innerHTML =
    `<div class="title">${title}</div>` +
    (sub ? `<div class="sub">${sub}</div>` : "") +
    (blink ? `<div class="big blink">按 P 继续</div>` : "");
}
function hideOverlay() { overlay.classList.add("hidden"); }
function endGame() {
  state = "gameover";
  Audio.powerdown();
  showOverlay("游戏结束", `最终得分 ${score} · 到达第 ${level} 关（${curDiff().name}）<br><br><span class="big blink">按任意键回到主菜单</span>`);
}

/* ================= 碰撞 ================= */
function hitsSolid(x, y, w, h, forTank) {
  const l = Math.floor(x / TILE), r = Math.floor((x + w - 1) / TILE);
  const t = Math.floor(y / TILE), b = Math.floor((y + h - 1) / TILE);
  for (let row = t; row <= b; row++) {
    for (let col = l; col <= r; col++) {
      if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return true;
      const c = map[row][col];
      if (c === "B" || c === "S" || c === "E") return true;
      if (forTank && c === "W") return true; // 水挡坦克、子弹可穿过
    }
  }
  return false;
}
function hitsTank(x, y, w, h, self) {
  const tanks = self === player ? enemies : [player];
  for (const t of tanks) {
    if (!t.alive) continue;
    if (x < t.x + TANK && x + w > t.x && y < t.y + TANK && y + h > t.y) return t;
  }
  return null;
}
function hitsBoss(x, y, w, h) {
  if (!boss || !boss.alive) return false;
  return x < boss.x + boss.w && x + w > boss.x && y < boss.y + boss.h && y + h > boss.y;
}
function snapAxis(v) {
  return Math.round((v + TANK / 2 - TILE / 2) / TILE) * TILE + (TILE - TANK) / 2;
}

/* ================= 移动（返回是否移动成功） ================= */
function moveTank(t, dx, dy) {
  let moved = false;
  if (dx !== 0) {
    t.x += dx;
    if (hitsSolid(t.x, t.y, TANK, TANK, true) || hitsTank(t.x, t.y, TANK, TANK, t) || (t === player && hitsBoss(t.x, t.y, TANK, TANK))) {
      t.x -= dx; t.y = snapAxis(t.y);
    } else moved = true;
  }
  if (dy !== 0) {
    t.y += dy;
    if (hitsSolid(t.x, t.y, TANK, TANK, true) || hitsTank(t.x, t.y, TANK, TANK, t) || (t === player && hitsBoss(t.x, t.y, TANK, TANK))) {
      t.y -= dy; t.x = snapAxis(t.x);
    } else moved = true;
  }
  return moved;
}

/* ================= 视线检测（敌人瞄准） ================= */
function hasLineOfSight(a, b) {
  const ax = a.x + TANK / 2, ay = a.y + TANK / 2;
  const bx = b.x + TANK / 2, by = b.y + TANK / 2;
  if (Math.abs(ax - bx) < TANK / 2 + 2) {
    const col = Math.floor(ax / TILE);
    const r1 = Math.floor(Math.min(ay, by) / TILE), r2 = Math.floor(Math.max(ay, by) / TILE);
    for (let r = r1; r <= r2; r++) { const c = map[r][col]; if (c === "B" || c === "S" || c === "E") return false; }
    return true;
  }
  if (Math.abs(ay - by) < TANK / 2 + 2) {
    const row = Math.floor(ay / TILE);
    const c1 = Math.floor(Math.min(ax, bx) / TILE), c2 = Math.floor(Math.max(ax, bx) / TILE);
    for (let c = c1; c <= c2; c++) { const t = map[row][c]; if (t === "B" || t === "S" || t === "E") return false; }
    return true;
  }
  return false;
}

/* ================= 更新 ================= */
function update(dt) {
  if (state !== "playing") return;
  const s = dt / 1000; // 秒

  // 玩家
  if (player.alive) {
    player.cooldown -= dt;
    let mx = 0, my = 0, dir = null;
    if (isDown(P_UP)) { my = -1; dir = DIR.UP; }
    else if (isDown(P_DOWN)) { my = 1; dir = DIR.DOWN; }
    else if (isDown(P_LEFT)) { mx = -1; dir = DIR.LEFT; }
    else if (isDown(P_RIGHT)) { mx = 1; dir = DIR.RIGHT; }
    if (dir !== null) player.dir = dir;
    if (mx || my) moveTank(player, mx * PLAYER_SPEED * s, my * PLAYER_SPEED * s);
    if (isDown(P_FIRE) && player.cooldown <= 0) {
      fireBullet(player, "player");
      player.cooldown = player.fire >= 2 ? 170 : 260;
    }
  } else {
    player.respawn -= dt;
    if (player.respawn <= 0 && lives > 0) {
      player = makePlayer(); player.shieldUntil = performance.now() + 2200;
    }
  }

  // Boss
  if (boss && boss.alive) updateBoss(dt);

  // 敌人
  spawnEnemies(dt);
  for (const e of enemies) {
    if (!e.alive) continue;
    e.cooldown -= dt; e.turn -= dt;
    e.flash = Math.max(0, e.flash - dt);

    if (player.alive && hasLineOfSight(e, player)) {
      const dx = (player.x + TANK / 2) - (e.x + TANK / 2);
      const dy = (player.y + TANK / 2) - (e.y + TANK / 2);
      e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
      if (e.cooldown <= 0) { fireBullet(e, "enemy"); e.cooldown = 2000 + Math.random() * 1600; }
    } else if (e.turn <= 0) {
      e.turn = 700 + Math.random() * 900;
      e.dir = pickEnemyDir(e);
    }

    const sp = e.speed * s;
    if (!moveTank(e, DX[e.dir] * sp, DY[e.dir] * sp)) {
      e.dir = pickEnemyDir(e);   // 撞墙转向
      e.turn = 250;
    }

    if (e.cooldown <= 0 && Math.random() < 0.15) {
      fireBullet(e, "enemy");
      e.cooldown = 2400 + Math.random() * 1800;
    }
  }

  // 子弹
  for (const b of bullets) {
    const bs = b.speed * s;
    b.x += DX[b.dir] * bs; b.y += DY[b.dir] * bs;
    b.dead = bulletHitTile(b) || bulletHitTank(b) || bulletHitBoss(b);
  }
  bullets = bullets.filter(b => !b.dead);

  // 道具
  for (const p of powerups) {
    p.t += dt;
    if (player.alive && overlap(p.x, p.y, TILE - 6, TILE - 6, player.x, player.y, TANK, TANK)) {
      applyPowerup(p); p.dead = true; Audio.pickup();
    }
  }
  powerups = powerups.filter(p => !p.dead);

  // 基地装甲到期
  if (baseArmoredUntil && performance.now() > baseArmoredUntil) {
    baseArmoredUntil = 0; setBase("B");
  }

  // 粒子
  particles = particles.filter(p => (p.life -= dt) > 0);

  // 通关检查（无尽模式：进入下一关）
  const aliveEnemies = enemies.filter(e => e.alive).length;
  const bossAlive = boss && boss.alive;
  if (enemiesRemaining <= 0 && aliveEnemies === 0 && spawnQueue.length === 0 && !bossAlive) {
    state = "levelclear";
    showOverlay(`第 ${level} 关通过！`, "得分 " + score);
    setTimeout(() => { level++; loadLevel(); }, 1400);
    return;
  }

  updateHud();
}

function pickEnemyDir(e) {
  const r = Math.random();
  if (r < 0.45) return DIR.DOWN;               // 偏向下行(逼近基地)
  if (r < 0.65 && player.alive) {              // 偶尔朝玩家方向
    const dx = player.x - e.x, dy = player.y - e.y;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
  }
  return Math.floor(Math.random() * 4);
}

function spawnEnemies(dt) {
  const limit = maxOnField(level);
  const alive = enemies.filter(e => e.alive).length;
  if (spawnQueue.length > 0) {
    const h = spawnQueue[0];
    h.t -= dt;
    if (h.t <= 0) {
      spawnQueue.shift();
      if (alive < limit && enemiesRemaining > 0) {
        enemies.push(makeEnemy(pickEnemyType(level), level));
        enemiesRemaining--;
      }
    }
  } else if (alive < limit && enemiesRemaining > 0) {
    spawnQueue.push({ t: spawnDelay(level) });
  }
}

function fireBullet(owner, side) {
  const cx = owner.x + TANK / 2, cy = owner.y + TANK / 2;
  const off = TANK / 2 + 2;
  const b = {
    x: cx + DX[owner.dir] * off - BULLET / 2,
    y: cy + DY[owner.dir] * off - BULLET / 2,
    dir: owner.dir, side, dead: false,
    power: side === "player" ? player.fire : 1,
    speed: side === "player" ? BULLET_SPEED[player.fire - 1] : ENEMY_BULLET_SPEED,
  };
  bullets.push(b);
  if (side === "player") Audio.shoot();
}

function bulletHitTile(b) {
  const l = Math.floor(b.x / TILE), r = Math.floor((b.x + BULLET - 1) / TILE);
  const t = Math.floor(b.y / TILE), btm = Math.floor((b.y + BULLET - 1) / TILE);
  for (let row = t; row <= btm; row++) {
    for (let col = l; col <= r; col++) {
      if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return true;
      const c = map[row][col];
      if (c === "B") { map[row][col] = "."; boom(row, col); Audio.hit(); return true; }
      if (c === "S") { if (b.power >= 3) { map[row][col] = "."; boom(row, col); } Audio.hit(); return true; }
      if (c === "E") { destroyBase(); return true; }
    }
  }
  return false;
}

function bulletHitTank(b) {
  const targets = b.side === "player" ? enemies : [player];
  for (const t of targets) {
    if (!t.alive) continue;
    if (b.side === "enemy" && t === player && t.shieldUntil > performance.now()) continue;
    if (b.side === "player" && t.flash > 0) continue; // 出生无敌帧
    if (b.x < t.x + TANK && b.x + BULLET > t.x && b.y < t.y + TANK && b.y + BULLET > t.y) {
      if (b.side === "player") {
        t.hp--;
        if (t.hp <= 0) killEnemy(t); else Audio.hit();
      } else {
        killPlayer();
      }
      return true;
    }
  }
  return false;
}

function bulletHitBoss(b) {
  if (!boss || !boss.alive || b.side !== "player") return false;
  if (b.x < boss.x + boss.w && b.x + BULLET > boss.x && b.y < boss.y + boss.h && b.y + BULLET > boss.y) {
    boss.hp--;
    if (boss.hp <= 0) killBoss(); else Audio.hit();
    return true;
  }
  return false;
}

function killEnemy(e) {
  e.alive = false;
  score += ETYPE[e.type].score;
  boom(e.x / TILE, e.y / TILE);
  Audio.boom();
  if (ETYPE[e.type].drop) {
    powerups.push(makePowerup(e.x, e.y));
  } else if (Math.random() < 0.1) {
    powerups.push(makePowerup(e.x, e.y));
  }
}

function killPlayer() {
  player.alive = false;
  lives--;
  boom(player.x / TILE, player.y / TILE);
  Audio.boom();
  if (lives <= 0) { endGame(); return; }
  player.respawn = 1200;
  updateHud();
}

function destroyBase() { boom(7, 14); Audio.powerdown(); endGame(); }

function applyPowerup(p) {
  score += 500;
  switch (p.type) {
    case "star": player.fire = Math.min(3, player.fire + 1); break;
    case "shield": player.shieldUntil = performance.now() + 8000; break;
    case "grenade":
      for (const e of enemies) if (e.alive) killEnemy(e);
      Audio.boom(); break;
    case "helmet": baseArmoredUntil = performance.now() + 12000; setBase("S"); break;
    case "life": lives = Math.min(MAX_LIVES, lives + 1); break;
  }
}

function setBase(t) {
  if (map[14][6] !== "E") map[14][6] = t;
  if (map[14][8] !== "E") map[14][8] = t;
  if (map[13][6] !== "E") map[13][6] = t;
  if (map[13][7] !== "E") map[13][7] = t;
  if (map[13][8] !== "E") map[13][8] = t;
}

function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function boom(tc, tr) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: tc * TILE + TILE / 2, y: tr * TILE + TILE / 2,
      vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
      life: 300 + Math.random() * 300, color: ["#f0c040", "#e06060", "#e8e8f0"][i % 3],
    });
  }
}

function updateHud() {
  elLevel.textContent = level;
  elDiff.textContent = curDiff().name;
  elDiff.style.color = curDiff().color;
  elScore.textContent = score;
  elLives.textContent = lives;
  elEnemies.textContent = enemiesRemaining + enemies.filter(e => e.alive).length;
}

/* ================= 绘制 ================= */
function draw() {
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, W, H);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = map[r][c];
      if (ch === "B") drawBrick(c * TILE, r * TILE);
      else if (ch === "S") drawSteel(c * TILE, r * TILE);
      else if (ch === "W") drawWater(c * TILE, r * TILE);
      else if (ch === "E") drawBase(c * TILE, r * TILE);
      else if (ch === "T") drawTree(c * TILE, r * TILE);
    }
  }

  for (const p of powerups) if (Math.floor(p.t / 200) % 2 === 0) drawPowerup(p);

  if (baseArmoredUntil && performance.now() < baseArmoredUntil) {
    ctx.strokeStyle = "rgba(120,255,160,.7)"; ctx.lineWidth = 2;
    ctx.strokeRect(6 * TILE - 1, 13 * TILE - 1, 3 * TILE + 2, 2 * TILE + 2);
  }

  if (player.alive) {
    if (player.shieldUntil > performance.now()) {
      if (Math.floor(performance.now() / 100) % 2 === 0) drawTank(player.x, player.y, player.dir, "#f0c040", "#5a4a10");
    } else {
      drawTank(player.x, player.y, player.dir, "#f0c040", "#5a4a10");
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    let col = ETYPE[e.type].color;
    if (e.flash > 0 && Math.floor(performance.now() / 80) % 2 === 0) col = "#ffffff";
    drawTank(e.x, e.y, e.dir, col, "#22242c");
  }

  if (boss && boss.alive) drawBoss();

  for (const b of bullets) {
    ctx.fillStyle = b.side === "player" ? "#fff" : "#ffd";
    ctx.fillRect(b.x, b.y, BULLET, BULLET);
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 600);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    p.x += p.vx; p.y += p.vy;
  }
  ctx.globalAlpha = 1;

  // 关卡横幅
  if (banner && performance.now() < banner.until) {
    const t = banner.until - performance.now();
    ctx.globalAlpha = Math.min(1, t / 400);
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, H / 2 - 52, W, 104);
    ctx.textAlign = "center";
    ctx.fillStyle = banner.color;
    ctx.font = "bold 30px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(banner.title, W / 2, H / 2 - 4);
    ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = "#e8e8f0";
    ctx.fillText(banner.sub, W / 2, H / 2 + 26);
    ctx.textAlign = "start";
    ctx.globalAlpha = 1;
  }
}

function drawBrick(x, y) {
  ctx.fillStyle = "#b3541e";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#3a1a08"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + TILE * 3 / 4, y + TILE / 2); ctx.lineTo(x + TILE * 3 / 4, y + TILE); ctx.stroke();
}

function drawSteel(x, y) {
  ctx.fillStyle = "#7a8294";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#c8d0e0"; ctx.lineWidth = 2;
  ctx.strokeRect(x + 3, y + 3, TILE - 6, TILE - 6);
  ctx.fillStyle = "#5a6274";
  ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
}

function drawWater(x, y) {
  ctx.fillStyle = "#1a4a8a";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#3a7ac8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 10); ctx.lineTo(x + 14, y + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 18, y + 22); ctx.lineTo(x + 28, y + 22); ctx.stroke();
}

function drawTree(x, y) {
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#1d5a2a";
  ctx.beginPath(); ctx.arc(x + TILE / 2, y + TILE / 2, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2a7a3a";
  ctx.beginPath(); ctx.arc(x + TILE / 2 - 4, y + TILE / 2 - 4, 7, 0, Math.PI * 2); ctx.fill();
}

function drawBase(x, y) {
  ctx.fillStyle = "#101018";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#3a3a4a";
  ctx.fillRect(x + 3, y + 20, TILE - 6, TILE - 23);
  ctx.strokeStyle = "#c8c8d8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + TILE / 2, y + 20); ctx.lineTo(x + TILE / 2, y + 6); ctx.stroke();
  ctx.fillStyle = "#e06040";
  ctx.beginPath();
  ctx.moveTo(x + TILE / 2, y + 5);
  ctx.lineTo(x + TILE / 2 + 13, y + 9);
  ctx.lineTo(x + TILE / 2, y + 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0c040";
  ctx.font = "8px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("★", x + TILE / 2 + 4, y + 13);
  ctx.textAlign = "start";
}

function drawTank(x, y, dir, body, barrel) {
  const cx = x + TANK / 2, cy = y + TANK / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(dir * Math.PI / 2);
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(-TANK / 2, -TANK / 2, 7, TANK);
  ctx.fillRect(TANK / 2 - 7, -TANK / 2, 7, TANK);
  ctx.fillStyle = body;
  ctx.fillRect(-TANK / 2 + 7, -TANK / 2 + 3, TANK - 14, TANK - 6);
  ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 2;
  ctx.strokeRect(-TANK / 2 + 7, -TANK / 2 + 3, TANK - 14, TANK - 6);
  ctx.fillStyle = barrel;
  ctx.fillRect(-3, -TANK / 2 - 8, 6, 10);
  ctx.fillRect(-7, -6, 14, 14);
  ctx.restore();
}

function drawBoss() {
  const b = boss;
  // 血条
  const bw = 56, bx = b.x + (b.w - bw) / 2, by = b.y - 10;
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
  ctx.fillStyle = "#5a0a0a";
  ctx.fillRect(bx, by, bw, 5);
  ctx.fillStyle = "#f04040";
  ctx.fillRect(bx, by, bw * Math.max(0, b.hp / b.maxHp), 5);
  // 本体（大坦克，炮管朝下）
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(b.dir * Math.PI / 2);
  ctx.fillStyle = "#2a0a0a";
  ctx.fillRect(-32, -32, 12, 64);
  ctx.fillRect(20, -32, 12, 64);
  ctx.fillStyle = "#b04040";
  ctx.fillRect(-20, -26, 40, 52);
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2;
  ctx.strokeRect(-20, -26, 40, 52);
  ctx.fillStyle = "#e8c040";
  ctx.fillRect(-5, -44, 10, 20);
  ctx.fillStyle = "#801818";
  ctx.fillRect(-13, -12, 26, 26);
  ctx.restore();
}

function drawPowerup(p) {
  const x = p.x + 3, y = p.y + 3, s = TILE - 6;
  ctx.fillStyle = "rgba(20,20,30,.9)";
  ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
  ctx.strokeStyle = "#f0c040"; ctx.lineWidth = 2;
  ctx.strokeRect(x - 1, y - 1, s + 2, s + 2);
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2);
  switch (p.type) {
    case "star":
      ctx.fillStyle = "#f0c040";
      starPath(0, 0, 12, 5); ctx.fill(); break;
    case "shield":
      ctx.fillStyle = "#40c0e0";
      ctx.beginPath();
      ctx.moveTo(0, -10); ctx.lineTo(9, -6); ctx.lineTo(9, 2);
      ctx.quadraticCurveTo(9, 9, 0, 11); ctx.quadraticCurveTo(-9, 9, -9, 2);
      ctx.lineTo(-9, -6); ctx.closePath(); ctx.fill(); break;
    case "grenade":
      ctx.fillStyle = "#3a3a3a";
      ctx.beginPath(); ctx.arc(0, 3, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(4, -9); ctx.stroke();
      ctx.fillStyle = "#e06040";
      ctx.beginPath(); ctx.arc(5, -10, 3, 0, Math.PI * 2); ctx.fill(); break;
    case "helmet":
      ctx.fillStyle = "#50c050";
      ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill();
      ctx.fillRect(-10, -2, 20, 5); break;
    case "life":
      ctx.fillStyle = "#e04040";
      ctx.beginPath(); ctx.moveTo(0, 10);
      ctx.quadraticCurveTo(-12, 2, -8, -6); ctx.quadraticCurveTo(-3, -11, 0, -4);
      ctx.quadraticCurveTo(3, -11, 8, -6); ctx.quadraticCurveTo(12, 2, 0, 10);
      ctx.fill(); break;
  }
  ctx.restore();
}

function starPath(cx, cy, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? R : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/* ================= 主循环 ================= */
function loop(t) {
  const dt = lastTime ? Math.min(40, t - lastTime) : 16;
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 启动 ================= */
state = "menu";
lastTime = 0;
level = 1; score = 0; lives = 3;
map = MAPS[0].map(r => r.split(""));
player = makePlayer();
enemies = []; bullets = []; powerups = []; particles = [];
spawnQueue = []; enemiesRemaining = 0; baseArmoredUntil = 0; banner = null; boss = null;
renderMenu();
requestAnimationFrame(loop);
</script>
</body>
