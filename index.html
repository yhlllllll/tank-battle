<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Battle City</title>
<style>
  :root {
    --bg: #0d0d14;
    --panel: #1a1a28;
    --border: #2e2e44;
    --accent: #f0c040;
    --text: #e8e8f0;
    --muted: #8a8aa0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #15151f, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #app { text-align: center; padding: 16px; }
  h1 {
    font-size: 26px;
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 14px rgba(240,192,64,.45);
    margin-bottom: 12px;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    margin: 0 auto 12px;
    max-width: 520px;
    font-size: 14px;
  }
  #hud .stat { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  #hud .stat b { color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }
  .dot { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  #stage {
    position: relative;
    display: inline-block;
    line-height: 0;
    border: 3px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: min(78vw, 520px);
    height: auto;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(8,8,14,.82);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay .title { font-size: 30px; letter-spacing: 4px; color: var(--accent); text-shadow: 0 0 16px rgba(240,192,64,.5); }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 1.7; }
  #overlay .big { font-size: 26px; letter-spacing: 3px; }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  #help { margin-top: 14px; color: var(--muted); font-size: 12.5px; line-height: 1.8; }
  #help kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 7px;
    font-family: inherit;
    color: var(--text);
  }
</style>
</head>
<body>
<div id="app">
  <h1>坦克大战</h1>
  <div id="hud">
    <div class="stat">关卡 <b id="level">1</b></div>
    <div class="stat"><span class="dot" style="background:#f0c040"></span> 生命 <b id="lives">3</b></div>
    <div class="stat"><span class="dot" style="background:#c05050"></span> 敌人 <b id="enemies">0</b></div>
    <div class="stat">得分 <b id="score">0</b></div>
  </div>
  <div id="stage">
    <canvas id="game" width="416" height="416"></canvas>
    <div id="overlay">
      <div class="title">坦克大战</div>
      <div class="sub">保护基地 🏠，消灭所有敌人！<br>
        键盘：<b>方向键 / WASD</b> 移动 · <b>空格</b> 射击<br>
        <b>P</b> 暂停 · <b>M</b> 静音</div>
      <div class="big blink">按任意键开始</div>
    </div>
  </div>
  <div id="help">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动 &nbsp; <kbd>空格</kbd> 射击 &nbsp; <kbd>P</kbd> 暂停 &nbsp; <kbd>M</kbd> 静音
  </div>
</div>

<script>
"use strict";

/* ================= 常量 ================= */
const TILE = 32;
const COLS = 13, ROWS = 13;
const W = COLS * TILE, H = ROWS * TILE;       // 416 x 416
const TANK = 28;                               // 坦克边长
const BULLET = 6;                              // 子弹边长
const PLAYER_SPEED = 2.6;                      // 每帧(60fps)像素
const ENEMY_SPEED = 1.15;
const BULLET_SPEED = 5.2;
const MAX_LIVES = 5;

const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

/* 地图字符：. 空地 B 砖墙 S 钢板 W 水 T 树 E 基地 */
const MAPS = [
  [
    ".............",
    ".B.B.B.B.B.B.",
    ".B.B.B.B.B.B.",
    ".....B.B.....",
    "..BB.....BB..",
    "..BB.BSB.BB..",
    ".....B.B.....",
    "..BB.BSB.BB..",
    "..BB.....BB..",
    ".....B.B.....",
    ".B.B.B.B.B.B.",
    ".B.B.B.B.B.B.",
    ".....BEB.....",
  ],
  [
    ".............",
    ".B.B.B.B.B.B.",
    ".B.B.B.B.B.B.",
    ".....B.B.....",
    "..BB.....BB..",
    "..BB.BSB.BB..",
    "..S..B.B..S..",
    "..BB.BSB.BB..",
    "..BB.....BB..",
    ".....B.B.....",
    ".B.B.B.B.B.B.",
    ".B.B.B.B.B.B.",
    ".....BEB.....",
  ],
  [
    ".............",
    ".B.B.B.B.B.B.",
    ".B.S.B.B.S.B.",
    ".....B.B.....",
    "..BB.....BB..",
    "..BB.BSB.BB..",
    ".....BSB.....",
    "..BB.BSB.BB..",
    "..BB.....BB..",
    ".....B.B.....",
    ".B.B.B.B.B.B.",
    ".B.B.B.B.B.B.",
    ".....BEB.....",
  ],
];

/* ================= 音效 ================= */
const Audio = (() => {
  let ctx = null, muted = false;
  function ensure() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return;
    const ac = ensure(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function noise(dur, vol) {
    if (muted) return;
    const ac = ensure(); if (!ac) return;
    const len = ac.sampleRate * dur;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf; g.gain.value = vol || 0.15;
    s.connect(g).connect(ac.destination); s.start();
  }
  return {
    shoot()    { tone(880, 0.08, "square", 0.05, 220); },
    boom()     { noise(0.25, 0.18); tone(160, 0.2, "sawtooth", 0.06, 60); },
    hit()      { tone(300, 0.06, "square", 0.05, 120); },
    pickup()   { tone(660, 0.09, "square", 0.08); setTimeout(() => tone(990, 0.12, "square", 0.08), 80); },
    powerdown(){ tone(440, 0.25, "sawtooth", 0.09, 80); },
    start()    { tone(440, 0.1, "square", 0.08); setTimeout(() => tone(660, 0.14, "square", 0.08), 110); },
    win()      { tone(523,0.12,"square",0.08); setTimeout(()=>tone(659,0.12,"square",0.08),120); setTimeout(()=>tone(784,0.2,"square",0.09),240); },
    toggleMute(){ muted = !muted; return muted; },
  };
})();

/* ================= 游戏状态 ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const elLevel = document.getElementById("level");
const elScore = document.getElementById("score");
const elLives = document.getElementById("lives");
const elEnemies = document.getElementById("enemies");

let map, level, score, lives, state, enemiesRemaining, spawnQueue;
let player, enemies, bullets, powerups, particles;
let baseArmoredUntil, freeze, freezeUntil, lastTime;

const keys = {};
const P_UP = ["ArrowUp", "KeyW"], P_DOWN = ["ArrowDown", "KeyS"],
      P_LEFT = ["ArrowLeft", "KeyA"], P_RIGHT = ["ArrowRight", "KeyD"],
      P_FIRE = ["Space", "Enter", "KeyJ"];

function resetGame() {
  level = 1; score = 0; lives = 3;
  loadLevel();
}

function loadLevel() {
  map = MAPS[(level - 1) % MAPS.length].map(r => r.split(""));
  player = makePlayer();
  enemies = []; bullets = []; powerups = []; particles = [];
  spawnQueue = []; enemiesRemaining = levelTotal(level);
  baseArmoredUntil = 0; freeze = 0; freezeUntil = 0;
  state = "playing";
  hideOverlay();
  updateHud();
}

function levelTotal(lv) { return Math.min(16 + lv * 2, 30); }
function levelSpeed(lv) { return Math.min(1.15 + (lv - 1) * 0.12, 2.4); }
function maxOnField(lv) { return Math.min(3 + Math.floor(lv / 2), 5); }

/* ================= 玩家 ================= */
function makePlayer() {
  return {
    x: 4 * TILE + (TILE - TANK) / 2, y: 12 * TILE + (TILE - TANK) / 2,
    dir: DIR.UP, fire: 1, alive: true, respawn: 0,
    shieldUntil: 0, cooldown: 0,
  };
}

/* ================= 敌人 ================= */
const ETYPE = [
  { color: "#9aa0b0", speed: 1.0, hp: 1, score: 100, drop: false },   // 普通
  { color: "#e06060", speed: 1.7, hp: 1, score: 200, drop: false },   // 快速
  { color: "#6f8f6f", speed: 0.9, hp: 2, score: 300, drop: false },   // 重甲
  { color: "#e8c040", speed: 1.0, hp: 1, score: 400, drop: true  },   // 补给(掉落道具)
];
function pickEnemyType(lv) {
  const r = Math.random();
  if (lv >= 3 && r < 0.12) return 3;
  if (lv >= 2 && r < 0.32) return 2;
  if (lv >= 1 && r < 0.6) return 1;
  return 0;
}
function makeEnemy(type, lv) {
  const points = [[0, 0], [6, 0], [12, 0]];
  const p = points[Math.floor(Math.random() * 3)];
  return {
    x: p[0] * TILE + (TILE - TANK) / 2, y: p[1] * TILE + (TILE - TANK) / 2,
    dir: DIR.DOWN, type, hp: ETYPE[type].hp,
    speed: ETYPE[type].speed * levelSpeed(lv),
    cooldown: 600 + Math.random() * 800,
    turn: 800 + Math.random() * 900,
    flash: 0,
  };
}

/* ================= 道具 ================= */
const PTYPE = ["star", "shield", "grenade", "helmet", "life"];
function makePowerup(x, y) {
  return { x, y, type: PTYPE[Math.floor(Math.random() * PTYPE.length)], t: 0 };
}

/* ================= 输入 ================= */
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    keys[e.code] = true;
    if (state === "menu" || state === "gameover" || state === "win") startPressed();
    else if (e.code === "KeyP") togglePause();
    else if (e.code === "KeyM") { Audio.toggleMute(); }
  }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function isDown(codes) { return codes.some(c => keys[c]); }

function startPressed() {
  Audio.start();
  resetGame();
}

function togglePause() {
  if (state === "playing") { state = "paused"; showOverlay("已暂停", "按 P 继续", true); }
  else if (state === "paused") { state = "playing"; hideOverlay(); }
}

/* ================= 覆盖层 ================= */
function showOverlay(title, sub, blink) {
  overlay.classList.remove("hidden");
  overlay.innerHTML =
    `<div class="title">${title}</div>` +
    (sub ? `<div class="sub">${sub}</div>` : "") +
    (blink ? `<div class="big blink">按 P 继续</div>` : "");
}
function hideOverlay() { overlay.classList.add("hidden"); }
function endGame(win) {
  state = win ? "win" : "gameover";
  if (win) Audio.win(); else Audio.powerdown();
  const t = win ? "胜利！" : "游戏结束";
  const s = win
    ? `最终得分 ${score} · 你守护了基地！`
    : `最终得分 ${score} · 基地被摧毁或生命耗尽`;
  showOverlay(t, s + `<br><br><span class="big blink">按任意键重新开始</span>`);
}

/* ================= 碰撞 ================= */
function hitsSolid(x, y, w, h, forTank) {
  const l = Math.floor(x / TILE), r = Math.floor((x + w - 1) / TILE);
  const t = Math.floor(y / TILE), b = Math.floor((y + h - 1) / TILE);
  for (let row = t; row <= b; row++) {
    for (let col = l; col <= r; col++) {
      if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return true;
      const c = map[row][col];
      if (c === "B" || c === "S" || c === "E") return true;
      if (forTank && c === "W") return true; // 水挡住坦克，子弹可穿过
    }
  }
  return false;
}
function hitsTank(x, y, w, h, self) {
  const tanks = self === player ? enemies : [player];
  for (const t of tanks) {
    if (!t.alive) continue;
    if (x < t.x + TANK && x + w > t.x && y < t.y + TANK && y + h > t.y) return t;
  }
  return null;
}
function snapAxis(v) {
  return Math.round((v + TANK / 2 - TILE / 2) / TILE) * TILE + (TILE - TANK) / 2;
}

/* ================= 移动 ================= */
function moveTank(t, dx, dy) {
  if (dx !== 0) {
    t.x += dx;
    if (hitsSolid(t.x, t.y, TANK, TANK, true) || hitsTank(t.x, t.y, TANK, TANK, t)) {
      t.x -= dx; t.y = snapAxis(t.y);
    }
  }
  if (dy !== 0) {
    t.y += dy;
    if (hitsSolid(t.x, t.y, TANK, TANK, true) || hitsTank(t.x, t.y, TANK, TANK, t)) {
      t.y -= dy; t.x = snapAxis(t.x);
    }
  }
}

/* ================= 更新 ================= */
function update(dt) {
  if (state !== "playing") return;

  // 玩家
  if (player.alive) {
    player.cooldown -= dt;
    let mx = 0, my = 0, dir = null;
    if (isDown(P_UP)) { my = -1; dir = DIR.UP; }
    else if (isDown(P_DOWN)) { my = 1; dir = DIR.DOWN; }
    else if (isDown(P_LEFT)) { mx = -1; dir = DIR.LEFT; }
    else if (isDown(P_RIGHT)) { mx = 1; dir = DIR.RIGHT; }
    if (dir !== null) player.dir = dir;
    if (mx || my) moveTank(player, mx * PLAYER_SPEED, my * PLAYER_SPEED);
    if (isDown(P_FIRE) && player.cooldown <= 0) {
      fireBullet(player, "player");
      player.cooldown = player.fire >= 2 ? 160 : 260;
    }
  } else {
    player.respawn -= dt;
    if (player.respawn <= 0 && lives > 0) {
      player = makePlayer(); player.shieldUntil = performance.now() + 2200;
    }
  }

  // 敌人
  spawnEnemies(dt);
  for (const e of enemies) {
    if (!e.alive) continue;
    e.cooldown -= dt; e.turn -= dt; e.flash = Math.max(0, e.flash - dt);
    // 决定方向
    if (e.turn <= 0) {
      e.turn = 600 + Math.random() * 1000;
      e.dir = pickEnemyDir(e);
    }
    const sp = e.speed;
    moveTank(e, DX[e.dir] * sp, DY[e.dir] * sp);
    // 撞墙时转向（移动后位置未变说明被挡住）
    const ox = e.x, oy = e.y;
    moveTank(e, DX[e.dir] * sp, DY[e.dir] * sp);
    if (e.x === ox && e.y === oy) { e.dir = pickEnemyDir(e); e.turn = 300; }
    if (e.cooldown <= 0) {
      if (e.dir === DIR.UP && Math.abs(e.x - player.x) < TILE && player.alive) {
        fireBullet(e, "enemy");
      } else if (Math.random() < 0.5) {
        fireBullet(e, "enemy");
      }
      e.cooldown = 900 + Math.random() * 1400;
    }
  }

  // 子弹
  for (const b of bullets) {
    b.x += DX[b.dir] * BULLET_SPEED; b.y += DY[b.dir] * BULLET_SPEED;
    b.dead = bulletHitTile(b) || bulletHitTank(b);
  }
  bullets = bullets.filter(b => !b.dead);

  // 道具
  for (const p of powerups) {
    p.t += dt;
    if (player.alive && overlap(p.x, p.y, TILE - 6, TILE - 6, player.x, player.y, TANK, TANK)) {
      applyPowerup(p); p.dead = true; Audio.pickup();
    }
  }
  powerups = powerups.filter(p => !p.dead);

  // 基地装甲到期
  if (baseArmoredUntil && performance.now() > baseArmoredUntil) {
    baseArmoredUntil = 0; setBase("B");
  }

  // 粒子
  particles = particles.filter(p => (p.life -= dt) > 0);

  // 通关检查
  const aliveEnemies = enemies.filter(e => e.alive).length;
  if (enemiesRemaining <= 0 && aliveEnemies === 0 && spawnQueue.length === 0) {
    level++;
    if (level > 5) { endGame(true); return; }
    state = "levelclear";
    showOverlay(`第 ${level - 1} 关通过！`, "进入下一关……");
    setTimeout(loadLevel, 1500);
    return;
  }

  updateHud();
}

function pickEnemyDir(e) {
  // 偏向下行（朝基地），偶尔随机
  const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
  const r = Math.random();
  if (r < 0.5) return DIR.DOWN;
  if (r < 0.7 && player.alive) {
    const dx = player.x - e.x, dy = player.y - e.y;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
  }
  return dirs[Math.floor(Math.random() * 4)];
}

function spawnEnemies(dt) {
  const limit = maxOnField(level);
  const alive = enemies.filter(e => e.alive).length;
  if (spawnQueue.length > 0) {
    const s = spawnQueue[0];
    s.t -= dt;
    if (s.t <= 0) {
      spawnQueue.shift();
      if (alive < limit && enemiesRemaining > 0) {
        enemies.push(makeEnemy(pickEnemyType(level), level));
        enemiesRemaining--;
      }
    }
  } else if (alive < limit && enemiesRemaining > 0) {
    spawnQueue.push({ t: 500 + Math.random() * 500 });
  }
}

function fireBullet(owner, side) {
  const cx = owner.x + TANK / 2, cy = owner.y + TANK / 2;
  const off = TANK / 2 + 2;
  const b = {
    x: cx + DX[owner.dir] * off - BULLET / 2,
    y: cy + DY[owner.dir] * off - BULLET / 2,
    dir: owner.dir, side, dead: false, power: side === "player" ? player.fire : 1,
  };
  bullets.push(b);
  if (side === "player") Audio.shoot();
}

function bulletHitTile(b) {
  const l = Math.floor(b.x / TILE), r = Math.floor((b.x + BULLET - 1) / TILE);
  const t = Math.floor(b.y / TILE), btm = Math.floor((b.y + BULLET - 1) / TILE);
  for (let row = t; row <= btm; row++) {
    for (let col = l; col <= r; col++) {
      if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return true;
      const c = map[row][col];
      if (c === "B") { map[row][col] = "."; boom(row, col); Audio.hit(); return true; }
      if (c === "S") { if (b.power >= 3) { map[row][col] = "."; boom(row, col); } Audio.hit(); return true; }
      if (c === "E") { destroyBase(); return true; }
    }
  }
  return false;
}

function bulletHitTank(b) {
  const targets = b.side === "player" ? enemies : [player];
  for (const t of targets) {
    if (!t.alive) continue;
    if (b.side === "enemy" && t === player && t.shieldUntil > performance.now()) continue;
    if (b.side === "player" && t.flash > 0) continue; // 出生无敌帧
    if (b.x < t.x + TANK && b.x + BULLET > t.x && b.y < t.y + TANK && b.y + BULLET > t.y) {
      if (b.side === "player") {
        t.hp--;
        if (t.hp <= 0) killEnemy(t);
        else Audio.hit();
      } else {
        killPlayer();
      }
      return true;
    }
  }
  return false;
}

function killEnemy(e) {
  e.alive = false;
  score += ETYPE[e.type].score;
  boom(e.x / TILE, e.y / TILE);
  Audio.boom();
  if (ETYPE[e.type].drop) {
    powerups.push(makePowerup(e.x, e.y));
  } else if (Math.random() < 0.08) {
    powerups.push(makePowerup(e.x, e.y));
  }
}

function killPlayer() {
  player.alive = false;
  lives--;
  boom(player.x / TILE, player.y / TILE);
  Audio.boom();
  if (lives <= 0) { endGame(false); return; }
  player.respawn = 1200;
  updateHud();
}

function destroyBase() {
  boom(6, 12);
  Audio.powerdown();
  endGame(false);
}

function applyPowerup(p) {
  score += 500;
  switch (p.type) {
    case "star": player.fire = Math.min(3, player.fire + 1); break;
    case "shield": player.shieldUntil = performance.now() + 8000; break;
    case "grenade":
      for (const e of enemies) if (e.alive) { killEnemy(e); }
      Audio.boom(); break;
    case "helmet": baseArmoredUntil = performance.now() + 12000; setBase("S"); break;
    case "life": lives = Math.min(MAX_LIVES, lives + 1); break;
  }
}

function setBase(t) {
  if (map[12][5] !== "E") map[12][5] = t;
  if (map[12][7] !== "E") map[12][7] = t;
}

function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function boom(tc, tr) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: tc * TILE + TILE / 2, y: tr * TILE + TILE / 2,
      vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
      life: 300 + Math.random() * 300, color: ["#f0c040", "#e06060", "#e8e8f0"][i % 3],
    });
  }
}

function updateHud() {
  elLevel.textContent = level;
  elScore.textContent = score;
  elLives.textContent = lives;
  elEnemies.textContent = enemiesRemaining + enemies.filter(e => e.alive).length;
}

/* ================= 绘制 ================= */
function draw() {
  // 背景
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, W, H);

  // 地块
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = map[r][c];
      if (ch === "B") drawBrick(c * TILE, r * TILE);
      else if (ch === "S") drawSteel(c * TILE, r * TILE);
      else if (ch === "W") drawWater(c * TILE, r * TILE);
      else if (ch === "E") drawBase(c * TILE, r * TILE);
      else if (ch === "T") drawTree(c * TILE, r * TILE);
    }
  }

  // 道具
  for (const p of powerups) if (Math.floor(p.t / 200) % 2 === 0) drawPowerup(p);

  // 基地装甲提示
  if (baseArmoredUntil && performance.now() < baseArmoredUntil) {
    ctx.strokeStyle = "rgba(120,255,160,.7)"; ctx.lineWidth = 2;
    ctx.strokeRect(5 * TILE - 1, 11 * TILE - 1, 3 * TILE + 2, 2 * TILE + 2);
  }

  // 玩家
  if (player.alive) {
    if (player.shieldUntil > performance.now()) {
      if (Math.floor(performance.now() / 100) % 2 === 0) drawTank(player.x, player.y, player.dir, "#f0c040", "#5a4a10", true);
    } else {
      drawTank(player.x, player.y, player.dir, "#f0c040", "#5a4a10", true);
    }
  }

  // 敌人
  for (const e of enemies) {
    if (!e.alive) continue;
    const et = ETYPE[e.type];
    let col = et.color;
    if (e.flash > 0 && Math.floor(performance.now() / 80) % 2 === 0) col = "#ffffff";
    drawTank(e.x, e.y, e.dir, col, "#22242c", false);
  }

  // 子弹
  for (const b of bullets) {
    ctx.fillStyle = b.side === "player" ? "#fff" : "#ffd";
    ctx.fillRect(b.x, b.y, BULLET, BULLET);
  }

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 600);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    p.x += p.vx; p.y += p.vy;
  }
  ctx.globalAlpha = 1;
}

function drawBrick(x, y) {
  ctx.fillStyle = "#b3541e";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#3a1a08"; ctx.lineWidth = 1;
  for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.moveTo(x, y + TILE / 2 + i * TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2 + i * TILE / 2); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + TILE * 3 / 4, y + TILE / 2); ctx.lineTo(x + TILE * 3 / 4, y + TILE); ctx.stroke();
}

function drawSteel(x, y) {
  ctx.fillStyle = "#7a8294";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#c8d0e0"; ctx.lineWidth = 2;
  ctx.strokeRect(x + 3, y + 3, TILE - 6, TILE - 6);
  ctx.fillStyle = "#5a6274";
  ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
}

function drawWater(x, y) {
  ctx.fillStyle = "#1a4a8a";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = "#3a7ac8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 10); ctx.lineTo(x + 14, y + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 18, y + 22); ctx.lineTo(x + 28, y + 22); ctx.stroke();
}

function drawTree(x, y) {
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#1d5a2a";
  ctx.beginPath(); ctx.arc(x + TILE / 2, y + TILE / 2, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2a7a3a";
  ctx.beginPath(); ctx.arc(x + TILE / 2 - 4, y + TILE / 2 - 4, 7, 0, Math.PI * 2); ctx.fill();
}

function drawBase(x, y) {
  ctx.fillStyle = "#101018";
  ctx.fillRect(x, y, TILE, TILE);
  // 基座
  ctx.fillStyle = "#3a3a4a";
  ctx.fillRect(x + 3, y + 20, TILE - 6, TILE - 23);
  // 鹰旗
  ctx.strokeStyle = "#c8c8d8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + TILE / 2, y + 20); ctx.lineTo(x + TILE / 2, y + 6); ctx.stroke();
  ctx.fillStyle = "#e06040";
  ctx.beginPath();
  ctx.moveTo(x + TILE / 2, y + 5);
  ctx.lineTo(x + TILE / 2 + 13, y + 9);
  ctx.lineTo(x + TILE / 2, y + 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0c040";
  ctx.font = "8px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("★", x + TILE / 2 + 4, y + 13);
  ctx.textAlign = "start";
}

function drawTank(x, y, dir, body, barrel, glow) {
  const cx = x + TANK / 2, cy = y + TANK / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(dir * Math.PI / 2);
  // 履带
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(-TANK / 2, -TANK / 2, 7, TANK);
  ctx.fillRect(TANK / 2 - 7, -TANK / 2, 7, TANK);
  // 车身
  ctx.fillStyle = body;
  ctx.fillRect(-TANK / 2 + 7, -TANK / 2 + 3, TANK - 14, TANK - 6);
  if (glow) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2; ctx.strokeRect(-TANK / 2 + 7, -TANK / 2 + 3, TANK - 14, TANK - 6); }
  // 炮管
  ctx.fillStyle = barrel;
  ctx.fillRect(-3, -TANK / 2 - 8, 6, 10);
  // 炮塔
  ctx.fillStyle = barrel;
  ctx.fillRect(-7, -6, 14, 14);
  ctx.restore();
}

function drawPowerup(p) {
  const x = p.x + 3, y = p.y + 3, s = TILE - 6;
  ctx.fillStyle = "rgba(20,20,30,.9)";
  ctx.fillRect(x - 1, y - 1, s + 2, s + 2);
  ctx.strokeStyle = "#f0c040"; ctx.lineWidth = 2;
  ctx.strokeRect(x - 1, y - 1, s + 2, s + 2);
  ctx.save();
  ctx.translate(x + s / 2, y + s / 2);
  switch (p.type) {
    case "star":
      ctx.fillStyle = "#f0c040";
      starPath(0, 0, 12, 5); ctx.fill(); break;
    case "shield":
      ctx.fillStyle = "#40c0e0";
      ctx.beginPath();
      ctx.moveTo(0, -10); ctx.lineTo(9, -6); ctx.lineTo(9, 2);
      ctx.quadraticCurveTo(9, 9, 0, 11); ctx.quadraticCurveTo(-9, 9, -9, 2);
      ctx.lineTo(-9, -6); ctx.closePath(); ctx.fill(); break;
    case "grenade":
      ctx.fillStyle = "#3a3a3a";
      ctx.beginPath(); ctx.arc(0, 3, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(4, -9); ctx.stroke();
      ctx.fillStyle = "#e06040";
      ctx.beginPath(); ctx.arc(5, -10, 3, 0, Math.PI * 2); ctx.fill(); break;
    case "helmet":
      ctx.fillStyle = "#50c050";
      ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill();
      ctx.fillRect(-10, -2, 20, 5); break;
    case "life":
      ctx.fillStyle = "#e04040";
      ctx.beginPath(); ctx.moveTo(0, 10);
      ctx.quadraticCurveTo(-12, 2, -8, -6); ctx.quadraticCurveTo(-3, -11, 0, -4);
      ctx.quadraticCurveTo(3, -11, 8, -6); ctx.quadraticCurveTo(12, 2, 0, 10);
      ctx.fill(); break;
  }
  ctx.restore();
}

function starPath(cx, cy, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? R : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/* ================= 主循环 ================= */
function loop(t) {
  const dt = lastTime ? Math.min(50, t - lastTime) : 16;
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 启动 ================= */
state = "menu";
lastTime = 0;
resetState();
function resetState() {
  map = MAPS[0].map(r => r.split(""));
  player = makePlayer();
  enemies = []; bullets = []; powerups = []; particles = [];
  spawnQueue = []; enemiesRemaining = 0; baseArmoredUntil = 0;
  updateHud();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
